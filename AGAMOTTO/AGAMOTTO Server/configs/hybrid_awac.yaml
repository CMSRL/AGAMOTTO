behaviors:
  AGAMOTTO_RL:
    trainer_type: awac
    awac_lambda: 1.0
    hyperparameters:
      learning_rate: 0.0003
      batch_size: 256
      buffer_init_steps: 1000
      tau: 0.005
      steps_per_update: 1
      awac_lambda: 1.0
    network_settings:
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 500000
    summary_freq: 1200
    checkpoint_interval: 5000
